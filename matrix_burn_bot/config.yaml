name: Matrix Burn Bot
version: 0.4.0
slug: matrix_burn_bot
description: "Matrix Burn Bot App. Only set the app options for the initial run. It is recommended to delete the app options after the initial run to protect your password."
url: "https://github.com/Croydon/ha-apps"
arch:
  - aarch64
  - amd64
init: false
map:
  - type: app_config
    read_only: false
    path: /app/matrix-burn-bot-rs-appdata
options:
  HOMESERVER_URL: "https://matrix.org"
  USER_ID: "@example:matrix.org"
  PASSWORD: ""
  KEY_BACKUP_PASSPHRASE: ""
schema:
  HOMESERVER_URL: str
  USER_ID: str
  PASSWORD: str
  KEY_BACKUP_PASSPHRASE: str
